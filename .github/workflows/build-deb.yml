name: Build .deb
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.event.base_ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dpkg
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Install dependencies
        run: npm ci
        working-directory: app/glanceboard

      - name: Build .deb
        run: bash packaging/build-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glanceboard-deb
          path: packaging/out/*.deb

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/out/*.deb
          generate_release_notes: true
